networks:
  mcp_network:
    external: true
    name: mcp_shared_network
services:
  # FastAPI application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-services-router
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-Multi-Services-Router}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - CHECKPOINT_DB=/app/checkpoints/checkpoint.db
      - WORKSPACE_PATH=/app/workspace
      - BOTS_MCP_URL=${BOTS_MCP_URL}
    volumes:
      - ./rag_pdfs:/app/rag_pdfs
      - ./workspace:/app/workspace
      - checkpoint_data:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mcp_network

volumes:
  checkpoint_data:

