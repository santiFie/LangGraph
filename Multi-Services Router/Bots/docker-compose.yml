version: '3.8'

networks:
  mcp_network:
    name: mcp_shared_network
services:
  api:
    build: ./api
    ports:
      - "8002:8000"
    volumes:
      - bot_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - mcp_network

  mcp:
    build: ./mcp
    ports:
      - "8001:8001"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - mcp_network

volumes:
  bot_data:
